<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Trending - SenQubyr</title>

    <link href="../css/style.css" rel="stylesheet">
    <link href="../images/youtubeKZicon.png" rel="icon" type="image/x-icon"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body class="">

<header class="header">
    <a href="../index.html" class="logo" id="SenQubyr">
        <img src="../images/youtubeKZicon.png" alt="Logo">
        SenQubyr
    </a>
    <div class="search">
        <input type="text" id="search" placeholder="Search" autocomplete="off">
        <a href="#" type="button" class="icon-btn" title="Search" id="searchBtn">
            <img src="../images/search.png" alt="search">
        </a>
        <div id="search-suggestions"></div>
    </div>
    <div class="flex">
        <a href="profile.html" class="icon-btn" title="Profile">
            <img src="../images/profile_picture_user_icon_153847.png" alt="profile">
        </a>
        <div class="form-check form-switch ms-2" id="themeSwitchContainer">
            <input class="form-check-input" type="checkbox" id="themeSwitch">
            <label class="form-check-label" for="themeSwitch">Night</label>
        </div>
    </div>
</header>

<div class="layout container-fluid py-3 py-lg-4">
    <aside class="sidebar">
        <div class="section">
            <a class="nav-item" href="../index.html"><span><img src="../images/house.png" alt="home"></span>Home</a>
            <a class="nav-item active" href="trending.html"><span><img src="../images/fire.png" alt="trending"></span>Trending</a>
        </div>
        <div class="section">
            <div style="color:var(--muted);font-size:13px;padding:6px 8px">Library</div>
            <a class="nav-item" href="history.html">History</a>
            <a class="nav-item" href="liked.html">Liked</a>
        </div>
    </aside>

    <main id="main-content">
        <div id="scrollProgress">
            <div id="scrollProgressBar"></div>
        </div>

        <section class="section-title">
            <h2 class="h4 mb-3" style="color: var(--muted);">🔥 Trending Now</h2>
            <p style="color: #666;">Most popular videos right now</p>
        </section>

        <section id="video-display-area">
            <div id="video-grid-main" class="grid mb-4"></div>
            <div id="loading-indicator" style="display: none; text-align: center; padding: 20px;">
                <p>Loading...</p>
            </div>
        </section>
    </main>
</div>

<div id="contactPopup" class="popup-overlay">
    <div class="popup-content">
        <button class="popup-close" data-popup-close>&times;</button>
        <h3 class="mb-4">Contact Us</h3>
        <form id="contactForm">
            <div class="form-group"><label for="contact-name">Your Name *</label><input type="text" id="contact-name"
                                                                                        name="name"
                                                                                        placeholder="Enter your name"
                                                                                        required></div>
            <div class="form-group"><label for="contact-email">Email *</label><input type="email" id="contact-email"
                                                                                     name="email"
                                                                                     placeholder="your@email.com"
                                                                                     required></div>
            <div class="form-group"><label for="message">Message *</label><textarea id="message" name="message" rows="4"
                                                                                    placeholder="Your message..."
                                                                                    required></textarea></div>
            <button type="submit" class="btn btn-primary w-100">Send Message</button>
        </form>
    </div>
</div>

<footer class="footer mt-auto">
    <div class="footer-links mb-2">
        <a href="#" id="aboutBtn">About us</a>
        <a href="#" id="rulesBtn">Rules</a>
        <a href="#" id="privacyBtn">Privacy Policy</a>
        <a href="#" data-popup-open="contactPopup">Contact Us</a>
    </div>
    <div class="footer-copy">
        © 2025 SenQubyr. Beknur Erdembek, Alisher Bolatkhanov
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="../js/script.js"></script>
</body>
</html>
