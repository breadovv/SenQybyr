<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login - SenQubyr</title>

    <link href="../css/style.css" rel="stylesheet">
    <link href="../images/youtubeKZicon.png" rel="icon" type="image/x-icon"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 12px;

        }

        .auth-container h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
        }

        .auth-container .btn-primary {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1rem;
            border-radius: 8px;
        }

        .switch-auth-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .switch-auth-link a {
            text-decoration: none;
            font-weight: 500;
        }

        .switch-auth-link a:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body class="">

<header class="header">
    <a href="../index.html" class="logo" id="SenQubyr">
        <img src="../images/youtubeKZicon.png" alt="Logo">
        SenQubyr
    </a>
    <div class="search">
        <input type="text" id="search" placeholder="Search" autocomplete="off">
        <a href="#" type="button" class="icon-btn" title="Search" id="searchBtn">
            <img src="../images/search.png" alt="search">
        </a>
        <div id="search-suggestions"></div>
    </div>
    <div class="flex">
        <a href="profile.html" class="icon-btn" title="Profile">
            <img src="../images/profile_picture_user_icon_153847.png" alt="profile">
        </a>
        <div class="form-check form-switch ms-2" id="themeSwitchContainer">
            <input class="form-check-input" type="checkbox" id="themeSwitch">
            <label class="form-check-label" for="themeSwitch">Night</label>
        </div>
    </div>
</header>

<main class="auth-wrapper">
    <div class="auth-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div class="switch-auth-link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>
</main>

<footer class="footer mt-auto">
    <div class="footer-links mb-2">
        <a href="#" id="aboutBtn">About us</a>
        <a href="#" id="rulesBtn">Rules</a>
        <a href="#" id="privacyBtn">Privacy Policy</a>
        <a href="#" data-popup-open="contactPopup">Contact Us</a>
    </div>
    <div class="footer-copy">
        © 2025 SenQubyr. Beknur Erdembek, Alisher Bolatkhanov
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="../js/script.js"></script>
</body>
</html>
