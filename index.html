<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SenQubyr - Home</title>
    <link href="css/style2.css" rel="stylesheet">
    <link href="images/youtubeKZicon.png" rel="icon" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .popup-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
            width: 35px;
            height: 35px;
            line-height: 35px;
            text-align: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .popup-close:hover {
            background: #f0f0f0;
            color: #dc3545;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #00c5ff;
        }

        .form-group input.error {
            border-color: #dc3545;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }

        .accordion-section {
            background: var(--card);
            border-radius: 12px;
            padding: 30px;
            margin: 30px 0;
        }

        .accordion-item {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .accordion-item:hover {
            border-color: #00c5ff;
        }

        .accordion-header {
            padding: 15px 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .accordion-header::after {
            content: '▼';
            transition: transform 0.3s;
        }

        .accordion-item.active .accordion-header::after {
            transform: rotate(180deg);
        }

        .accordion-content {
            padding: 0 20px 15px;
            display: none;
        }

        .feature-box {
            background: var(--card);
            border-radius: 12px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
        }

        .bg-changer-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .bg-changer-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .datetime-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        .datetime-display small {
            display: block;
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .footer .jq-counter-section {
            background: none;
            padding: 0;
            margin-top: 20px;
            text-align: center;
        }

        .footer .jq-counter-section h2 {
            font-size: 18px;
            color: var(--muted);
            margin-bottom: 15px;
        }

        .footer .counter-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer .counter-box {
            background: var(--card);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            min-width: 100px;
        }

        .footer .counter {
            font-size: 28px;
            font-weight: 700;
            color: #00c5ff;
            margin-bottom: 5px;
        }

        .footer .counter-label {
            font-size: 14px;
            color: #666;
        }

        .header .time-display-container {
            position: relative;
            display: flex;
            align-items: center;
            margin-left: 10px;
        }

        .header .time-display-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            font-weight: 500;
            font-size: 14px;
            transition: color 0.2s;
        }

        .header .time-display-btn img {
            width: 20px;
            height: 20px;
            margin-right: 5px;
        }

        .header .time-display-btn:hover {
            color: #00c5ff;
        }

        .header .current-time-popup {
            position: absolute;
            background: var(--card);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            top: calc(100% + 10px);
            right: 0;
            min-width: 180px;
            text-align: center;
            font-size: 14px;
            display: none;
            z-index: 100;
        }

        .header .current-time-popup.active {
            display: block;
        }

        .thumb-lg img, .thumb-shorts img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }
        .thumb-lg, .thumb-shorts {
            background-image: none;
        }
        .search {
            position: relative;
        }
        #search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg);
            border: 1px solid #ccc;
            border-top: none;
            z-index: 100;
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
        }
        .suggestion-item:hover {
            background-color: var(--hover-bg);
        }
    </style>
</head>
<body>
<header class="header">
    <a href="index.html" class="logo" id="SenQubyr">
        <img src="images/youtubeKZicon.png" alt="Logo">
        SenQubyr
    </a>
    <div class="search">
        <input type="text" id="search" placeholder="Search" autocomplete="off">
        <a href="#" type="button" class="icon-btn" title="Search" id="searchBtn">
            <img src="images/search.png" alt="search">
        </a>
        <div id="search-suggestions"></div>
    </div>
    <div class="flex">
        <a href="./templates/profile.html" class="icon-btn" title="Profile">
            <img src="images/profile_picture_user_icon_153847.png" alt="profile">
        </a>
        <div class="form-check form-switch ms-2" id="themeSwitchContainer">
            <input class="form-check-input" type="checkbox" id="themeSwitch">
            <label class="form-check-label" for="themeSwitch">Night</label>
        </div>
    </div>
</header>

<div class="layout flex-grow-1">
    <aside class="sidebar">
        <div class="section">
            <a class="nav-item active" href="index.html"><span><img src="images/house.png" alt="home"></span>Home</a>
            <a class="nav-item" href="./templates/trending.html"><span><img src="images/fire.png" alt="trending"></span>Trending</a>
        </div>
        <div class="section">
            <div style="color:var(--muted);font-size:13px;padding:6px 8px">Library</div>
            <a class="nav-item" href="./templates/history.html">History</a>
            <a class="nav-item" href="./templates/liked.html">Liked</a>
        </div>
    </aside>

    <main id="main-content">
        <div id="scrollProgress"><div id="scrollProgressBar"></div></div>

        <section class="section-title">
            <header class="top-header">
                <nav class="nav-links">
                    <a href="#" class="icon-btn a">All</a>
                    <a href="#" class="icon-btn a">Music</a>
                    <a href="#" class="icon-btn a">Jams</a>
                    <a href="#" class="icon-btn a">Video Games</a>
                    <a href="#" class="icon-btn a">Podcasts</a>
                    <a href="#" class="icon-btn a">Live</a>
                    <a href="#" class="icon-btn a">Animation</a>
                    <a href="#" class="icon-btn a">Natural</a>
                </nav>
            </header>
        </section>

        <section id="video-display-area">
            <h2 id="grid-title" class="mb-3">Featured Videos</h2>
            <div id="video-grid-main" class="grid mb-4"></div>
            <div id="loading-indicator" style="display: none; text-align: center; padding: 20px;">
                <p>Loading...</p>
            </div>

            <div class="section-title logo mb-3">
                <img src="images/shortsicon.png" alt="Shorts">
                Shorts
            </div>
            <div id="shorts-grid" class="grid-2 mb-4">
            </div>
        </section>
    </main>
</div>

<div id="subscriptionPopup" class="popup-overlay">
    <div class="popup-content">
        <button class="popup-close" data-popup-close>&times;</button>
        <h3 class="mb-4">Subscribe to SenQubyr</h3>

        <form id="subscriptionForm">
            <div class="form-group">
                <label for="sub-name">Full Name *</label>
                <input type="text" id="sub-name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="sub-email">Email Address *</label>
                <input type="email" id="sub-email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="sub-password">Password * (min 8 characters)</label>
                <input type="password" id="sub-password" name="password" placeholder="Enter password" required>
            </div>

            <div class="form-group">
                <label for="sub-confirm">Confirm Password *</label>
                <input type="password" id="sub-confirm" name="confirmPassword" placeholder="Confirm password" required>
            </div>

            <div class="form-group">
                <label for="sub-channel">Preferred Content</label>
                <select id="sub-channel" name="channel">
                    <option value="">Select preference</option>
                    <option value="music">Music</option>
                    <option value="gaming">Gaming</option>
                    <option value="tech">Technology</option>
                    <option value="education">Education</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Subscribe Now</button>
        </form>
    </div>
</div>

<div id="contactPopup" class="popup-overlay">
    <div class="popup-content">
        <button class="popup-close" data-popup-close>&times;</button>
        <h3 class="mb-4">Contact Us</h3>

        <form id="contactForm">
            <div class="form-group">
                <label for="contact-name">Your Name *</label>
                <input type="text" id="contact-name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="contact-email">Email *</label>
                <input type="email" id="contact-email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="message">Message *</label>
                <textarea id="message" name="message" rows="4" placeholder="Your message..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Send Message</button>
        </form>
    </div>
</div>

<footer class="footer mt-auto">
    <div class="footer-links mb-2">
        <a href="#" id="aboutBtn">About us</a>
        <a href="#" id="rulesBtn">Rules</a>
        <a href="#" id="privacyBtn">Privacy Policy</a>
        <a href="#" data-popup-open="contactPopup">Contact Us</a>
    </div>
    <div class="footer-copy">
        © 2025 SenQubyr. Beknur Erdembek, Alisher Bolatkhanov
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/script.js"></script>
<script>
    $(document).ready(function() {
        let nextPageToken = null;
        let currentQuery = 'new kazakh music';
        let isLoading = false;
        const API_KEY = 'AIzaSyD5fRLyb7XGYinVF6a-xdUgcCofxw5s5iQ';

        $('[data-popup-open]').on('click', function() {
            var popupId = $(this).data('popup-open');
            $('#' + popupId).fadeIn();
        });

        $('[data-popup-close]').on('click', function() {
            $(this).closest('.popup-overlay').fadeOut();
        });

        $('.popup-overlay').on('click', function(e) {
            if ($(e.target).is('.popup-overlay')) {
                $(this).fadeOut();
            }
        });

        $('#aboutBtn').on('click', function(e) {
            e.preventDefault();
            alert('SenQubyr is a project by Beknur Erdembek and Alisher Bolatkhanov created in 2025.');
        });
        $('#rulesBtn').on('click', function(e) {
            e.preventDefault();
            alert('Rules: Be respectful to other users. No spamming or posting inappropriate content.');
        });
        $('#privacyBtn').on('click', function(e) {
            e.preventDefault();
            alert('Privacy Policy: We value your privacy. Your data is not shared with third parties.');
        });

        function fetchMainVideos(query, isAppending = false, pageToken = null) {
            if (isLoading) return;
            isLoading = true;
            $('#loading-indicator').show();

            let apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&maxResults=8&type=video&key=${API_KEY}`;
            if (pageToken) {
                apiUrl += `&pageToken=${pageToken}`;
            }

            $.ajax({
                url: apiUrl,
                method: 'GET',
                success: function(response) {
                    nextPageToken = response.nextPageToken || null;
                    let videoHtml = '';
                    if (response.items.length === 0 && !isAppending) {
                        $('#video-grid-main').html('<p>No videos found.</p>');
                        return;
                    }
                    response.items.forEach(item => {
                        const videoId = item.id.videoId;
                        const title = item.snippet.title;
                        const channelTitle = item.snippet.channelTitle;
                        const thumbnailUrl = item.snippet.thumbnails.high.url;
                        const publishedAt = new Date(item.snippet.publishedAt).toLocaleDateString();

                        videoHtml += `
                            <div class="tile">
                                <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" style="text-decoration: none;">
                                    <div class="thumb thumb-lg">
                                        <img src="${thumbnailUrl}" alt="${title}">
                                    </div>
                                    <div class="tmeta">
                                        <p class="ttitle">${title}</p>
                                        <p class="tsub">${channelTitle} • ${publishedAt}</p>
                                    </div>
                                </a>
                            </div>
                        `;
                    });

                    if (isAppending) {
                        $('#video-grid-main').append(videoHtml);
                    } else {
                        $('#video-grid-main').html(videoHtml);
                    }
                },
                error: function() {
                    $('#video-grid-main').html('<p>Error loading videos. Please check your API key or network connection.</p>');
                },
                complete: function() {
                    isLoading = false;
                    $('#loading-indicator').hide();
                }
            });
        }

        function fetchShorts() {
            const shortsQuery = 'latest #shorts';
            const apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(shortsQuery)}&maxResults=4&type=video&key=${API_KEY}`;
            $.ajax({
                url: apiUrl,
                method: 'GET',
                success: function(response) {
                    let videoHtml = '';
                    response.items.forEach(item => {
                        const videoId = item.id.videoId;
                        const title = item.snippet.title;
                        const channelTitle = item.snippet.channelTitle;
                        const thumbnailUrl = item.snippet.thumbnails.high.url;
                        videoHtml += `
                            <div class="tile">
                                <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" style="text-decoration: none;">
                                    <div class="thumb thumb-shorts">
                                        <img src="${thumbnailUrl}" alt="${title}">
                                    </div>
                                    <div class="tmeta">
                                        <p class="short-title">${title}</p>
                                        <p class="tsub">${channelTitle}</p>
                                    </div>
                                </a>
                            </div>
                        `;
                    });
                    $('#shorts-grid').html(videoHtml);
                },
                error: function() {
                    $('#shorts-grid').html('<p>Error loading shorts.</p>');
                }
            });
        }

        function handleSearch() {
            const query = $('#search').val().trim();
            $('#search-suggestions').hide();
            if (query !== '') {
                currentQuery = query;
                nextPageToken = null;
                $('#grid-title').text(`Search Results for "${query}"`);
                fetchMainVideos(currentQuery, false, null);
            }
        }

        $('#searchBtn').on('click', function(e) {
            e.preventDefault();
            handleSearch();
        });

        $('#search').on('keypress', function(e) {
            if (e.which === 13) {
                e.preventDefault();
                handleSearch();
            }
        });

        $('#search').on('keyup', function() {
            const query = $(this).val();
            if (query.length < 2) {
                $('#search-suggestions').hide();
                return;
            }

            $.ajax({
                url: 'https://suggestqueries.google.com/complete/search',
                dataType: 'jsonp',
                data: { client: 'youtube', ds: 'yt', q: query },
                success: function(data) {
                    const suggestions = data[1];
                    let suggestionsHtml = '';
                    suggestions.forEach(suggestion => {
                        suggestionsHtml += `<div class="suggestion-item">${suggestion[0]}</div>`;
                    });
                    $('#search-suggestions').html(suggestionsHtml).show();
                }
            });
        });

        $(document).on('click', '.suggestion-item', function() {
            $('#search').val($(this).text());
            $('#search-suggestions').hide();
            handleSearch();
        });

        $(document).on('click', function(e) {
            if (!$(e.target).closest('.search').length) {
                $('#search-suggestions').hide();
            }
        });

        $(window).on('scroll', function() {
            if (!isLoading && nextPageToken && ($(window).scrollTop() + $(window).height() >= $(document).height() - 250)) {
                fetchMainVideos(currentQuery, true, nextPageToken);
            }
        });

        fetchMainVideos(currentQuery);
        fetchShorts();
    });
</script>
</body>
</html>
