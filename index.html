<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SenQubyr - Home</title>
    <link href="css/style.css" rel="stylesheet">
    <link href="images/youtubeKZicon.png" rel="icon" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .popup-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
            width: 35px;
            height: 35px;
            line-height: 35px;
            text-align: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .popup-close:hover {
            background: #f0f0f0;
            color: #dc3545;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #00c5ff;
        }
        .datetime-display small {
            display: block;
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        .footer .jq-counter-section h2 {
            font-size: 18px;
            color: var(--muted);
            margin-bottom: 15px;
        }
        .header .time-display-btn img {
            width: 20px;
            height: 20px;
            margin-right: 5px;
        }
        .thumb-lg img, .thumb-shorts img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }
        .thumb-lg, .thumb-shorts {
            background-image: none;
        }
        .search {
            position: relative;
        }
        #search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg);
            border: 1px solid #ccc;
            border-top: none;
            z-index: 100;
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<header class="header">
    <a href="index.html" class="logo" id="SenQubyr">
        <img src="images/youtubeKZicon.png" alt="Logo">
        SenQubyr
    </a>
    <div class="search">
        <input type="text" id="search" placeholder="Search" autocomplete="off">
        <a href="#" type="button" class="icon-btn" title="Search" id="searchBtn">
            <img src="images/search.png" alt="search">
        </a>
        <div id="search-suggestions"></div>
    </div>
    <div class="flex">
        <a href="./templates/profile.html" class="icon-btn" title="Profile">
            <img src="images/profile_picture_user_icon_153847.png" alt="profile">
        </a>
        <div class="form-check form-switch ms-2" id="themeSwitchContainer">
            <input class="form-check-input" type="checkbox" id="themeSwitch">
            <label class="form-check-label" for="themeSwitch">Night</label>
        </div>
    </div>
</header>

<div class="layout flex-grow-1">
    <aside class="sidebar">
        <div class="section">
            <a class="nav-item active" href="index.html"><span><img src="images/house.png" alt="home"></span>Home</a>
            <a class="nav-item" href="./templates/trending.html"><span><img src="images/fire.png" alt="trending"></span>Trending</a>
        </div>
        <div class="section">
            <div style="color:var(--muted);font-size:13px;padding:6px 8px">Library</div>
            <a class="nav-item" href="./templates/history.html">History</a>
            <a class="nav-item" href="./templates/liked.html">Liked</a>
        </div>
    </aside>

    <main id="main-content">
        <div id="scrollProgress"><div id="scrollProgressBar"></div></div>

        <section class="section-title">
            <header class="top-header">
                <nav class="nav-links">
                    <a href="#" class="icon-btn a">All</a>
                    <a href="#" class="icon-btn a">Music</a>
                    <a href="#" class="icon-btn a">Jams</a>
                    <a href="#" class="icon-btn a">Video Games</a>
                    <a href="#" class="icon-btn a">Podcasts</a>
                    <a href="#" class="icon-btn a">Live</a>
                    <a href="#" class="icon-btn a">Animation</a>
                    <a href="#" class="icon-btn a">Natural</a>
                </nav>
            </header>
        </section>

        <section id="video-display-area">
            <h2 id="grid-title" class="mb-3">Featured Videos</h2>
            <div id="video-grid-main" class="grid mb-4"></div>
            <div id="loading-indicator" style="display: none; text-align: center; padding: 20px;">
                <p>Loading...</p>
            </div>

        </section>
    </main>
</div>

<div id="subscriptionPopup" class="popup-overlay">
    <div class="popup-content">
        <button class="popup-close" data-popup-close>&times;</button>
        <h3 class="mb-4">Subscribe to SenQubyr</h3>

        <form id="subscriptionForm">
            <div class="form-group">
                <label for="sub-name">Full Name *</label>
                <input type="text" id="sub-name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="sub-email">Email Address *</label>
                <input type="email" id="sub-email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="sub-password">Password * (min 8 characters)</label>
                <input type="password" id="sub-password" name="password" placeholder="Enter password" required>
            </div>

            <div class="form-group">
                <label for="sub-confirm">Confirm Password *</label>
                <input type="password" id="sub-confirm" name="confirmPassword" placeholder="Confirm password" required>
            </div>

            <div class="form-group">
                <label for="sub-channel">Preferred Content</label>
                <select id="sub-channel" name="channel">
                    <option value="">Select preference</option>
                    <option value="music">Music</option>
                    <option value="gaming">Gaming</option>
                    <option value="tech">Technology</option>
                    <option value="education">Education</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Subscribe Now</button>
        </form>
    </div>
</div>

<div id="contactPopup" class="popup-overlay">
    <div class="popup-content">
        <button class="popup-close" data-popup-close>&times;</button>
        <h3 class="mb-4">Contact Us</h3>

        <form id="contactForm">
            <div class="form-group">
                <label for="contact-name">Your Name *</label>
                <input type="text" id="contact-name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="contact-email">Email *</label>
                <input type="email" id="contact-email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="message">Message *</label>
                <textarea id="message" name="message" rows="4" placeholder="Your message..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Send Message</button>
        </form>
    </div>
</div>

<footer class="footer mt-auto">
    <div class="footer-links mb-2">
        <a href="#" id="aboutBtn">About us</a>
        <a href="#" id="rulesBtn">Rules</a>
        <a href="#" id="privacyBtn">Privacy Policy</a>
        <a href="#" data-popup-open="contactPopup">Contact Us</a>
    </div>
    <div class="footer-copy">
        © 2025 SenQubyr. Beknur Erdembek, Alisher Bolatkhanov
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="js/script.js"></script>
</body>
</html>
